function boardTrain(){ try{startRide()}catch(e){console.error(e);window.rideError=e.message;document.getElementById('boarding')?.remove();}
(() => {
  "use strict";
  const ride = window.ride;
  const q = id => document.getElementById(id);
  const app = q("alpine"), canvas = q("view"), hint = q("ride-hint");
  const play = q("ride-play"), audioButton = q("ride-audio"), home = q("ride-home");
  const full = q("ride-full"), show = q("ride-show"), error = q("ride-error");
  const timeline = app.querySelector(".ride-stops");
  const chapterButtons = [...app.querySelectorAll(".ride-stop")];
  const chapterPositions = chapterButtons.map(button => Number(button.dataset.position));
  const routeLength = 4096;
  const mql = window.matchMedia("(prefers-reduced-motion: reduce)");
  let current = {x: 0, playing: true, speed: 20, tunnel: 0};
  let activeChapter = -1, fullscreen = false, immersive = false, hinted = true;
  let audio = null, soundEnabled = false, soundPending = false;
  function icon(button, id) { button.querySelector("use").setAttribute("href", "#ri-" + id); }
  function label(button, name) { button.setAttribute("aria-label", name); button.title = name; }
  function hideHint() { if (hinted) { hinted = false; hint.classList.add("is-gone"); } }
  function report(message) { error.textContent = message; error.hidden = false; }
  window.addEventListener("rideerror", event => report(event.detail?.message || "The view could not start. Try reloading this file in a WebGL-enabled browser."));
  if (!ride) {
    report(window.rideError || "The view could not start. Try opening this file in a WebGL-enabled browser.");
    [...chapterButtons, play, audioButton, home, full].forEach(button => button.disabled = true);
    hideHint();
    return;
  }

  // One generated loop, with separately filtered chassis/air and rail joints.
  function makeAudio() {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return null;
    const context = new Audio();
    const sr = context.sampleRate, duration = 8, n = Math.floor(duration * sr);
    const buffer = context.createBuffer(2, n, sr);
    let seed = 7451893, low = 0, soft = 0, mids = 0;
    const noise = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 2147483648 - 1; };
    const lumps = [0.55, 0.95, 0.50, 0.82, 0.75, 0.96, 0.63, 0.76];
    const left = buffer.getChannelData(0), right = buffer.getChannelData(1);
    for (let i=0; i<n; i++) {
      const t=i/sr, w=noise(), v=noise();
      low += (w-low) * .014;
      soft += (v-soft) * .006;
      mids += (w-mids) * .084;
      const joint = Math.floor(t), dt = t - joint;
      let tick = 0;
      for (let j=0; j<2; j++) {
        const tt = dt - .145 - j*.146;
        if (tt >= 0 && tt < .14)
          tick += Math.exp(-tt*42) * (1-Math.exp(-tt*1450)) *
            (Math.sin(Math.PI*2*(73-j*10)*tt)*.40 + Math.sin(Math.PI*2*(135-j*19)*tt)*.17 + mids*.27) * lumps[joint];
      }
      const edge = Math.min(1, i/900, (n-i-1)/900);
      const body = 2.7*low + 1.25*soft + .20*tick;
      left[i] = edge * (body + .045*(w-mids));
      right[i] = edge * (body + .068*(v-soft));
    }
    const source = context.createBufferSource();
    const filter = context.createBiquadFilter();
    const gain = context.createGain();
    source.buffer = buffer;
    source.loop = true;
    filter.type = "lowpass";
    filter.frequency.value = 840;
    filter.Q.value = .12;
    gain.gain.value = 0;
    source.connect(filter).connect(gain).connect(context.destination);
    source.start();
    return {context, source, filter, gain};
  }
  function updateSound() {
    if (!audio) return;
    const t = audio.context.currentTime;
    const tunnel = Math.min(1, Math.max(0, Number(current.tunnel)||0));
    const speed = Math.max(0, Number(current.speed)||0);
    const rate = speed ? Math.min(1.42, Math.max(.55, speed/21)) : 1;
    audio.source.playbackRate.setTargetAtTime(rate, t, .35);
    audio.filter.frequency.setTargetAtTime(842 - 408*tunnel, t, .32);
    audio.gain.gain.setTargetAtTime((soundEnabled && current.playing ? .35+.15*tunnel : 0), t, .18);
  }
  audioButton.disabled = !(window.AudioContext || window.webkitAudioContext);
  audioButton.addEventListener("click", async () => {
    if (soundPending) return;
    if (soundEnabled) { soundEnabled = false; }
    else {
      soundPending = true;
      try {
        audio ||= makeAudio();
        if (!audio) return;
        await audio.context.resume();
        soundEnabled = audio.context.state === "running";
      } catch (_) { soundEnabled = false; }
      finally { soundPending = false; }
    }
    audioButton.setAttribute("aria-pressed", String(soundEnabled));
    audioButton.title = soundEnabled ? "Turn off carriage sound" : "Turn on carriage sound";
    icon(audioButton, soundEnabled ? "sound" : "muted");
    updateSound();
  });

  function update(detail = {}) {
    current = {...current,...detail};
    const distance = ((Number(current.x) || 0) % routeLength + routeLength) % routeLength;
    timeline.style.setProperty("--progress", (100*distance/routeLength).toFixed(2) + "%");
    let chapter = 0;
    for (let i=1; i<chapterPositions.length; i++) if(distance >= chapterPositions[i]-.02) chapter = i;
    if (activeChapter !== chapter) {
      chapterButtons.forEach((button, index) => {
        if (index === chapter) button.setAttribute("aria-current", "step");
        else button.removeAttribute("aria-current");
      });
      activeChapter = chapter;
    }
    const playLabel = current.playing ? "Pause journey" : "Resume journey";
    if (play.getAttribute("aria-label") !== playLabel) {
      label(play, playLabel);
      icon(play, current.playing ? "pause" : "play");
    }
    updateSound();
  }
  function pause(playing) {
    ride.play(playing);
    update({playing});
  }
  chapterButtons.forEach((button, i) => {
    button.addEventListener("click", () => {
      ride.seek(chapterPositions[i]);
      ride.home();
      update({x: chapterPositions[i]});
      hideHint();
    });
  });
  play.addEventListener("click", () => pause(!current.playing));
  home.addEventListener("click", () => {
    ride.home();
    canvas.focus({preventScroll:true});
  });
  canvas.addEventListener("pointerdown", hideHint, {passive:true});
  canvas.addEventListener("wheel", hideHint, {passive:true});
  canvas.addEventListener("keydown", event => {
    if(event.key.startsWith("Arrow") || event.key==="+" || event.key==="-") hideHint();
  });
  window.setTimeout(hideHint, 8500);
  window.addEventListener("rideupdate", event => update(event.detail));
  function refreshFullscreen() {
    fullscreen = document.fullscreenElement === app || document.webkitFullscreenElement === app;
    icon(full, fullscreen ? "unfull" : "full");
    label(full, fullscreen ? "Exit full screen" : (typeof app.requestFullscreen === "function" ? "Enter full screen" : "Hide controls"));
  }
  function immerse(hide) {
    immersive = hide;
    app.classList.toggle("ride-quiet", hide);
    show.hidden = !hide;
    (hide ? show : full).focus({preventScroll:true});
    window.dispatchEvent(new Event("resize"));
  }
  full.addEventListener("click", async () => {
    if (fullscreen) {
      if (document.exitFullscreen) await document.exitFullscreen().catch(() => {});
      return;
    }
    try {
      if (typeof app.requestFullscreen !== "function") throw Error("Unavailable");
      await app.requestFullscreen();
      canvas.focus({preventScroll:true});
    } catch(_) { immerse(true); }
  });
  show.addEventListener("click", () => immerse(false));
  document.addEventListener("fullscreenchange", () => {
    const wasFullscreen = fullscreen;
    refreshFullscreen();
    if(wasFullscreen && !fullscreen) full.focus({preventScroll:true});
    window.dispatchEvent(new Event("resize"));
  });
  window.addEventListener("keydown", event => { if(event.key==="Escape" && immersive) immerse(false); });
  mql.addEventListener?.("change", event => { if(event.matches) pause(false); });
  update(ride.state || {});
  if (mql.matches && current.playing) pause(false);
  refreshFullscreen();
})();

} requestAnimationFrame(()=>setTimeout(boardTrain,30));
</script></body></html>
